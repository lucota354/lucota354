<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Lucas Fernandez — Founder at AmberMy Tech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#18212f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="120" fill="#f59e0b" opacity=".10" filter="url(#glow)"/>
  <circle cx="1135" cy="275" r="150" fill="#38bdf8" opacity=".08" filter="url(#glow)"/>
  <rect x="62" y="70" width="6" height="180" rx="3" fill="url(#accent)"/>

  <text x="95" y="130" fill="#f8fafc" font-size="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Lucas Fernandez</text>
  <text x="98" y="177" fill="#fbbf24" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Founder @ AmberMy Tech</text>
  <text x="98" y="222" fill="#cbd5e1" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif">AI Automation  •  SaaS  •  Full-Stack  •  Cybersecurity</text>
  <text x="98" y="263" fill="#94a3b8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Building software, automations and digital products that solve real business problems.</text>

  <g transform="translate(950 118)">
    <rect width="175" height="62" rx="14" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="87.5" y="27" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">AMBERMY</text>
    <text x="87.5" y="47" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">TECH</text>
  </g>
</svg>